<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подъезд</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; color: #cfc9b8; }
  canvas { display: block; }
  #dot { position: fixed; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: rgba(255,255,255,.35); pointer-events: none; }
  #hint { position: fixed; left: 0; right: 0; top: 56%; text-align: center; font-size: 15px; letter-spacing: .06em; color: rgba(220,215,200,.75); pointer-events: none; opacity: 0; transition: opacity .2s; }
  #msg { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; font-size: 19px; padding: 0 24px; text-shadow: 0 0 8px #000; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.86); cursor: pointer; text-align: center; }
  #overlay h1 { font-weight: normal; font-size: 54px; letter-spacing: .5em; margin: 0 0 28px .5em; color: #b9b3a2; }
  #overlay p { margin: 6px 0; font-size: 15px; color: #7d796d; letter-spacing: .05em; }
  #overlay .go { margin-top: 30px; color: #a9a392; }
  #paper { position: fixed; left: 50%; top: 50%; width: min(440px, 86vw); transform: translate(-50%, -50%) rotate(-1.2deg); background: #d9d2b8; color: #26231c; padding: 30px 34px 26px; box-shadow: 0 0 60px #000; font-family: 'Courier New', monospace; font-size: 15px; line-height: 1.55; display: none; }
  #paper h2 { margin: 0 0 14px; font-size: 18px; text-align: center; letter-spacing: .12em; }
  #paper ol { margin: 0; padding-left: 24px; }
  #paper .sign { margin-top: 16px; text-align: right; font-style: italic; }
  #paper .close { margin-top: 14px; text-align: center; font-size: 12px; color: #6d675a; }
</style>
</head>
<body>
<div id="dot"></div>
<div id="hint"></div>
<div id="msg"></div>
<div id="paper"></div>
<div id="overlay">
  <h1>ПОДЪЕЗД</h1>
  <p>WASD — идти · мышь — смотреть · E — действие</p>
  <p>Лучше в наушниках.</p>
  <p class="go" id="go">Нажми, чтобы войти</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const H = 3;            // floor height
const FLOORS = 5;       // 0 = lobby, 1..3 = puzzle floors, 4 = home
const RUN = 2.52;       // horizontal length of a flight
const STEPS = 9, RISE = 1.5 / STEPS, TREAD = RUN / STEPS;
const SW = 3.0;         // stair shaft width (x: 0..SW)
const BX1 = 1.2, AX0 = 1.8;          // flight B is x 0..BX1, open well, flight A is x AX0..SW
const BXC = BX1 / 2, AXC = (AX0 + SW) / 2, MIDX = (BX1 + AX0) / 2;
const LAND_END = RUN + 1.3;
const HALL_W = 3.2, HALL_D = 2.6;   // hall: x -HALL_W..SW, z -HALL_D..0
const R = 0.28;         // player radius
const EYE = 1.62;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const FOG = 0x040607;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.FogExp2(FOG, 0.13);
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 40);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.AmbientLight(0x8fa3b0, 0.035));

// low-res render target + film pass: grain, dither, colour fringing, vignette
const RT_H = 432;
const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, magFilter: THREE.NearestFilter, minFilter: THREE.NearestFilter });
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, res: { value: new THREE.Vector2() }, time: { value: 0 }, fear: { value: 0 }, fade: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D t; uniform vec2 res; uniform float time, fear, fade; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + time * 37.0) * 43758.5453); }
    void main(){
      vec2 c = vUv - .5; float r2 = dot(c, c);
      vec2 uv = .5 + c * (1.0 - 0.05 * r2);
      float ca = (0.004 + 0.012 * fear) * r2;
      vec3 col = vec3(texture2D(t, uv + c * ca).r, texture2D(t, uv).g, texture2D(t, uv - c * ca).b);
      col = pow(max(col, 0.0), vec3(1.0 / 2.2));
      float l = dot(col, vec3(.3, .59, .11));
      col = mix(vec3(l), col, 0.85 - 0.35 * fear);
      vec2 px = floor(vUv * res);
      col += (hash(px) - .5) * (0.075 + 0.07 * fear);
      float d = (mod(px.x + px.y * 2.0, 4.0) / 4.0 - .375) / 28.0;
      col = floor((col + d) * 28.0 + .5) / 28.0;
      col *= clamp(1.0 - r2 * (1.5 + fear), 0.0, 1.0);
      gl_FragColor = vec4(col * fade, 1.0);
    }`
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const w = Math.round(RT_H * innerWidth / innerHeight);
  rt.setSize(w, RT_H); post.uniforms.res.value.set(w, RT_H);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// the player's phone torch: the only light that casts shadows
const TORCH = 15;
const torch = new THREE.SpotLight(0xdde6ff, TORCH, 0, 0.5, 0.75, 1.7);
torch.position.set(0.24, -0.2, 0.1); camera.add(torch); camera.add(torch.target); torch.target.position.set(0, -0.06, -1);
torch.castShadow = true; torch.shadow.mapSize.set(1024, 1024); torch.shadow.camera.near = 0.1; torch.shadow.camera.far = 14;
torch.shadow.bias = -0.003; torch.shadow.normalBias = 0.02;

// ---------- textures ----------
function tex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function grime(g, w, h, n = 70, a = 0.09) {
  for (let i = 0; i < n; i++) {
    const r = rand(w * 0.03, w * 0.22), x = rand(0, w), y = rand(0, h);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(0,0,0,${Math.random() * a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < n * 30; i++) {
    g.fillStyle = `rgba(${Math.random() < 0.5 ? 0 : 255},${Math.random() < 0.5 ? 0 : 255},0,${Math.random() * 0.04})`;
    g.fillRect(rand(0, w), rand(0, h), 2, 2);
  }
}
const GREEN = '#3c6654', WHITE = '#b5b1a0';
// wall where paint covers [s, s+1.5] (mod 3) at each column; sFn(u 0..1) -> s in metres
function wallTex(sFn) {
  return tex(512, 512, (g, w, h) => {
    g.fillStyle = WHITE; g.fillRect(0, 0, w, h);
    for (let px = 0; px < w; px++) {
      const s = ((sFn(px / w) % 3) + 3) % 3;
      const seg = (a, b) => { // metres -> canvas
        g.fillStyle = GREEN; g.fillRect(px, h * (1 - b / 3), 1, h * (b - a) / 3);
        g.fillStyle = '#27443a'; g.fillRect(px, h * (1 - b / 3), 1, 3);
      };
      if (s + 1.5 <= 3) seg(s, s + 1.5); else { seg(s, 3); seg(0, s - 1.5); }
    }
    grime(g, w, h);
    g.strokeStyle = 'rgba(20,20,20,.25)'; g.lineWidth = 1;
    for (let i = 0; i < 14; i++) { g.beginPath(); const x = rand(0, w), y = rand(0, h); g.moveTo(x, y); g.lineTo(x + rand(-40, 40), y + rand(-40, 40)); g.stroke(); }
  });
}
const mat = (o) => new THREE.MeshLambertMaterial(o);
const mWallBand = mat({ map: wallTex(() => 0) });
const mWallBack = mat({ map: wallTex(() => 1.5) });
const mWallA = mat({ map: wallTex(u => { const z = u * LAND_END; return z < RUN ? 1.5 * z / RUN : 1.5; }), side: THREE.DoubleSide });
const mWallB = mat({ map: wallTex(u => { const z = u * LAND_END; return z < RUN ? 3 - 1.5 * z / RUN : 1.5; }), side: THREE.DoubleSide });
const tileDraw = (g, w, h) => {
  const n = 8, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    g.fillStyle = (i + j) % 2 ? '#6b5a4a' : '#8a7c68'; g.fillRect(i * s, j * s, s, s);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.strokeRect(i * s + .5, j * s + .5, s - 1, s - 1);
  }
  grime(g, w, h, 40, 0.14);
};
const mFloorHall = mat({ map: tex(256, 256, tileDraw, [5, 2.2]) });
const mFloorLand = mat({ map: tex(256, 256, tileDraw, [2.2, 1.1]) });
const mConcrete = mat({ map: tex(256, 256, (g, w, h) => { g.fillStyle = '#7c7a72'; g.fillRect(0, 0, w, h); grime(g, w, h, 90, 0.12); }) });
const mCeil = mat({ map: tex(256, 256, (g, w, h) => { g.fillStyle = '#a29e8f'; g.fillRect(0, 0, w, h); grime(g, w, h, 50, 0.1); }) });
const mRail = mat({ color: 0x2a1c14 });
const mMetal = mat({ color: 0x3a3f3d });
const mDark = mat({ color: 0x15171a });
function doorTex(base) {
  return tex(128, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.5;
    for (let i = -8; i < 12; i++) {
      g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32 + h / 2, h); g.stroke();
      g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32 - h / 2, h); g.stroke();
    }
    g.fillStyle = 'rgba(190,170,110,.6)';
    for (let y = 0; y <= h; y += 32) for (let x = (y / 32) % 2 ? 16 : 0; x <= w; x += 32) { g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    grime(g, w, h, 20, 0.15);
  });
}
const doorMats = ['#3b2318', '#2a2420', '#412b22', '#1f2a26', '#33211c'].map(c => mat({ map: doorTex(c) }));
function labelTex(text, o = {}) {
  const w = o.w || 256, h = o.h || 128;
  return tex(w, h, (g) => {
    if (o.bg) { g.fillStyle = o.bg; g.fillRect(0, 0, w, h); }
    g.fillStyle = o.color || '#111'; g.font = o.font || 'bold 90px Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = text.split('\n');
    lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * (o.lh || 40)));
    if (o.bg) grime(g, w, h, 8, 0.08);
  });
}

// ---------- geometry helpers ----------
const world = new THREE.Group(); scene.add(world);
function box(w, h, d, x, y, z, m, parent = world) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); parent.add(b); return b;
}
function plane(w, h, x, y, z, ry, m, parent = world) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.rotation.y = ry; parent.add(p); return p;
}
const TH = Math.atan2(1.5, RUN), FLEN = Math.hypot(1.5, RUN);

const lamps = [];
function addLamp(x, y, z, base, kind) {
  const light = new THREE.PointLight(0xffc98a, base, 8.5, 2); light.position.set(x, y, z); world.add(light);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe2b0, fog: false }));
  bulb.position.set(x, y, z); world.add(bulb);
  box(0.012, 0.25, 0.012, x, y + 0.17, z, mDark);
  const l = { light, bulb, base, kind, on: true, t: rand(0.5, 3), off: 0, f: 1 };
  lamps.push(l); return l;
}

const interact = [];   // {pos, label, act}
const peepholes = [];

const doors = [];
function buildDoor(x, y, z, ry, m, number, floor) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; world.add(g);
  box(1.02, 2.14, 0.05, 0, 1.07, 0.0, mDark, g);
  box(0.9, 2.05, 0.07, 0, 1.025, 0.02, m, g);
  box(0.03, 0.12, 0.05, 0.36, 1.0, 0.06, mMetal, g);
  if (number == null) return g;
  const lit = Math.random() < 0.6;   // light is on inside
  const peep = new THREE.Mesh(new THREE.CircleGeometry(0.02, 10), new THREE.MeshBasicMaterial({ color: lit ? 0xffb060 : 0x101214, fog: false }));
  peep.position.set(0, 1.5, 0.057); g.add(peep);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.09), mat({ map: labelTex(String(number), { bg: '#b9a878', font: 'bold 84px Arial' }) }));
  p.position.set(0, 1.75, 0.057); g.add(p);
  box(0.8, 0.02, 0.45, 0, 0.01, 0.3, mMat, g);
  doors.push({ pos: new THREE.Vector3(x, y + 1.5, z), peep, lit, peeped: false, knocked: false, floor, silenced: false });
  return g;
}
const mMat = mat({ color: 0x2e241c });
const GRAFFITI = ['ЦОЙ ЖИВ', 'НЕ СТОЙ', 'тише', 'здесь был Саня', 'ОН ИДЁТ,\nКОГДА ТЫ СТОИШЬ', 'Оля, выходи', '15 кв. — кто там?', 'не оборачивайся'].sort(() => Math.random() - 0.5);
function graffiti(x, y, z, ry) {
  const t = GRAFFITI.pop(); if (!t) return;
  const p = plane(1.1, 0.5, x, y, z, ry, mat({ map: labelTex(t, { w: 512, h: 232, font: `italic ${t.length > 14 ? 44 : 60}px "Comic Sans MS", "Marker Felt", cursive`, color: 'rgba(15,18,22,.8)', lh: 60 }), transparent: true }));
  p.rotation.z = rand(-0.12, 0.12);
}

// ---------- build ----------
const mWin = new THREE.MeshBasicMaterial({ color: 0x0c1524 });
const mPanel = mat({ map: labelTex('ЩЭ', { bg: '#59605c', font: 'bold 40px Arial', color: '#b33' }) });
for (let n = 0; n < FLOORS; n++) {
  const y0 = n * H, yc = y0 + H / 2;
  // hall slab: tile on top, ceiling below
  box(HALL_W + SW, 0.2, HALL_D, (SW - HALL_W) / 2, y0 - 0.1, -HALL_D / 2, [mConcrete, mConcrete, mFloorHall, mCeil, mConcrete, mConcrete]);
  // hall walls
  box(HALL_W + SW + 0.2, H, 0.1, (SW - HALL_W) / 2, yc, -HALL_D - 0.05, mWallBand);
  box(0.1, H, HALL_D, -HALL_W - 0.05, yc, -HALL_D / 2, mWallBand);
  box(0.1, H, HALL_D, SW + 0.05, yc, -HALL_D / 2, mWallBand);
  box(HALL_W, H, 0.1, -HALL_W / 2, yc, 0.05, mWallBand);
  // shaft walls
  plane(LAND_END, H, SW, yc, LAND_END / 2, -Math.PI / 2, mWallA);
  plane(LAND_END, H, 0, yc, LAND_END / 2, -Math.PI / 2, mWallB);
  plane(SW, H, SW / 2, yc, LAND_END, Math.PI, mWallBack);
  // pipe in the corner
  { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, H, 8), mMetal); c.position.set(SW - 0.1, yc, -HALL_D + 0.1); world.add(c); }

  // lift
  box(0.08, 2.2, 1.3, -HALL_W + 0.03, y0 + 1.1, -1.3, mDark);
  box(0.04, 2.05, 0.52, -HALL_W + 0.08, y0 + 1.025, -1.57, mMetal);
  box(0.04, 2.05, 0.52, -HALL_W + 0.08, y0 + 1.025, -1.03, mMetal);
  box(0.04, 0.16, 0.1, -HALL_W + 0.03, y0 + 1.1, -0.5, mMetal);
  interact.push({ pos: new THREE.Vector3(-HALL_W + 0.05, y0 + 1.1, -0.5), label: 'вызвать лифт', act: () => { sfxClunk(); say('Кнопка проваливается и не возвращается.'); } });

  // lamp in hall
  addLamp(-0.6, y0 + 2.5, -1.3, n === 0 ? 5 : rand(1.8, 2.8), n === 2 ? 'flicker' : 'normal');

  if (n === 0) {
    // entrance door, mailboxes, rules, lift sign, way down is walled off
    const d = buildDoor(-1.9, 0, -HALL_D + 0.01, 0, mMetal, null); d.scale.set(1.25, 1.02, 1);
    interact.push({ pos: new THREE.Vector3(-1.9, 1.2, -HALL_D), label: 'открыть', act: () => { sfxClunk(); say('Заперто. Домофон молчит.'); } });
    const mb = tex(256, 128, (g, w, h) => {
      g.fillStyle = '#3d4d5c'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) {
        g.strokeStyle = '#1c242c'; g.lineWidth = 3; g.strokeRect(i * 42 + 3, j * 62 + 3, 40, 58);
        g.fillStyle = '#10151a'; g.fillRect(i * 42 + 10, j * 62 + 14, 26, 4);
        g.fillStyle = '#aab'; g.font = '14px Arial'; g.fillText(String(5 + j * 6 + i), i * 42 + 15, j * 62 + 44);
      }
      grime(g, w, h, 20, 0.15);
    });
    box(1.3, 0.62, 0.12, -2.25, 1.45, -0.06, [mMetal, mMetal, mMetal, mMetal, mMetal, mat({ map: mb })]);
    plane(0.4, 0.56, -0.8, 1.5, -0.006, Math.PI, mat({ map: paperTexture() }));
    interact.push({ pos: new THREE.Vector3(-0.8, 1.5, 0), label: 'прочитать', act: () => togglePaper(true) });
    plane(0.5, 0.2, -HALL_W + 0.125, 1.75, -1.3, Math.PI / 2, mat({ map: labelTex('ЛИФТ\nНЕ РАБОТАЕТ', { bg: '#cfc8ae', font: 'bold 34px Arial', lh: 44 }) }));
    box(AX0, H - 0.2, 0.1, AX0 / 2, 1.4, 0.05, mWallBand);
    box(SW, 0.2, LAND_END, SW / 2, -0.1, LAND_END / 2, mConcrete);
  } else {
    // apartment doors, painted floor number, fuse box, scribbles
    const nums = [n * 3 + 2, n * 3 + 3, n * 3 + 4];
    buildDoor(-1.9, y0, -HALL_D + 0.01, 0, doorMats[(n * 3) % 5], nums[0], n);
    buildDoor(1.0, y0, -HALL_D + 0.01, 0, doorMats[(n * 3 + 1) % 5], nums[1], n);
    buildDoor(SW - 0.01, y0, -1.3, -Math.PI / 2, doorMats[(n * 3 + 2) % 5], nums[2], n);
    plane(0.7, 0.7, -1.6, y0 + 2.1, -0.006, Math.PI, mat({ map: labelTex(String(n + 1), { w: 128, h: 128, font: 'bold 110px Arial', color: 'rgba(25,40,34,.8)' }), transparent: true }));
    box(0.55, 0.75, 0.12, -2.6, y0 + 1.5, -0.06, [mMetal, mMetal, mMetal, mMetal, mMetal, mPanel]);
    if (n !== 2) graffiti(-0.45, y0 + 1.25, -HALL_D + 0.006, 0);
  }

  if (n < FLOORS - 1) {
    // flight A (up, x AX0..SW), mid landing, flight B (x 0..BX1), open well between them
    for (let i = 0; i < STEPS; i++) {
      box(1.2, RISE * 1.5, TREAD, AXC, y0 + (i + 1) * RISE - RISE * 0.75, (i + 0.5) * TREAD, mConcrete);
      box(1.2, RISE * 1.5, TREAD, BXC, y0 + H - i * RISE - RISE * 0.75, (i + 0.5) * TREAD, mConcrete);
      const z = (i + 0.5) * TREAD;
      box(0.02, 0.9, 0.02, AX0 + 0.03, y0 + 1.5 * z / RUN + 0.45, z, mMetal);
      box(0.02, 0.9, 0.02, BX1 - 0.03, y0 + H - 1.5 * z / RUN + 0.45, z, mMetal);
    }
    const sa = box(1.2, 0.22, FLEN, AXC, y0 + 0.75 - 0.11 * Math.cos(TH), RUN / 2 + 0.11 * Math.sin(TH), mCeil); sa.rotation.x = -TH;
    const sb = box(1.2, 0.22, FLEN, BXC, y0 + 2.25 - 0.11 * Math.cos(TH), RUN / 2 - 0.11 * Math.sin(TH), mCeil); sb.rotation.x = TH;
    const ra = box(0.05, 0.05, FLEN, AX0 + 0.03, y0 + 0.75 + 0.92, RUN / 2, mRail); ra.rotation.x = -TH;
    const rb = box(0.05, 0.05, FLEN, BX1 - 0.03, y0 + 2.25 + 0.92, RUN / 2, mRail); rb.rotation.x = TH;
    // rail across the well on the mid landing
    box(AX0 - BX1, 0.05, 0.05, MIDX, y0 + 1.5 + 0.92, RUN + 0.03, mRail);

}

}
function free(x, z, y) {

  else {

}

  A.hum.gain.setTargetAtTime(hum, A.ctx.currentTime, 0.05);
  // doors: a lit peephole may go dark when you look into it; a handle may move behind your back
  eventCd -= dt; camera.getWorldDirection(vDir);
  for (const d of doors) {
    vTo.copy(d.pos).sub(camera.position); const dist = vTo.length(); if (dist > 1.7) continue;
    const dot = vTo.normalize().dot(vDir);
    if (d.lit && !d.peeped && dist < 1.3 && dot > 0.92) { d.peeped = true; if (Math.random() < 0.3) setTimeout(() => { d.peep.material.color.set(0x030303); creak(d.pos); }, 600); }
    if (!d.knocked && dot < -0.3 && eventCd <= 0) { d.knocked = true; if (Math.random() < 0.35) { eventCd = 45; rattle(d.pos); } }
  }
  // lift cabin passes behind the closed doors
  if (lift.state === 0 && Math.abs(P.y - lift.floor * H) < 0.2 && P.z < -0.5) { lift.state = 1; lift.t = -2.5; }
  if (lift.state === 1) {
    const was = lift.t; lift.t += dt; const y0 = lift.floor * H;
    if (was < 0 && lift.t >= 0) liftSound(new THREE.Vector3(-HALL_W, y0 + 1, -1.3));
    const c = y0 + 1 + (lift.t / 6 * 2 - 1) * 3.4, a = Math.max(c - 0.95, y0 + 0.03), b = Math.min(c + 0.95, y0 + 2.04);
    const vis = lift.t > 0 && b > a;
    lift.strip.visible = vis; lift.light.intensity = vis ? 1.2 * (b - a) : 0;
    if (vis) { lift.strip.scale.y = b - a; lift.strip.position.y = (a + b) / 2; lift.light.position.y = (a + b) / 2; }
    if (lift.t > 6) { lift.state = 2; lift.strip.visible = false; lift.light.intensity = 0; }
  }
  // voices
  { const now = A.ctx.currentTime, m = A.mur, md = murDoors[clamp(Math.round(P.y / H), 1, 3)];
    murT -= dt;
    if (murT <= 0) { murT = rand(0.08, 0.26); m.bp.frequency.setTargetAtTime(rand(350, 1500), now, 0.03); m.mod.gain.setTargetAtTime(Math.random() < 0.2 ? 0 : rand(0.3, 1), now, 0.03); m.osc.frequency.setTargetAtTime(rand(95, 150), now, 0.05); }
    let g = 0;
    if (!md.silenced) { const d = camera.position.distanceTo(md.pos); if (d < 2.0) md.silenced = true; else { g = Math.pow(clamp(1 - d / 7, 0, 1), 2) * 0.45; setPos(m.pan, md.pos); } }
    m.dist.gain.setTargetAtTime(g, now, md.silenced ? 0.015 : 0.3); }
  // distant life of the house
  farT -= dt;
  if (farT <= 0) {
    farT = rand(18, 45);
    const pos = new THREE.Vector3(rand(-3, 2), P.y + rand(4, 9), rand(-3, 3));
    if (Math.random() < 0.5) { const f0 = rand(500, 900); for (let i = 0; i < 3; i++) tick(f0, 0.025, i * rand(0.25, 0.4)); }   // pipes
    else thud({ gain: 0.25, cutoff: 260, f0: 70, f1: 35, len: 0.3, send: 1, pos });                                           // a door, far above
  }
}

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running) {
    T += dt;
    const px = P.x, pz = P.z;
    if (!reading) {
      const fw = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const st = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      if (fw || st) {
        const onStairs = P.z > 0 && P.z < RUN;
        const sp = (onStairs ? 1.75 : 2.3) * dt / Math.hypot(fw, st);
        const sx = Math.sin(P.yaw), cz = Math.cos(P.yaw);
        const dx = (-sx * fw + cz * st) * sp, dz = (-cz * fw - sx * st) * sp;
        if (free(P.x + dx, P.z, P.y)) P.x += dx;
        if (free(P.x, P.z + dz, P.y)) P.z += dz;
      }
    }
    const dist = Math.hypot(P.x - px, P.z - pz);
    P.speed = lerp(P.speed, dist / dt, 0.3);
    const moving = P.speed > 0.4;
    P.y += (ground(P.x, P.z, P.y) - P.y) * Math.min(1, dt * 16);
    const onStairs = P.z > 0 && P.z < RUN;
    P.stepAcc += dist; P.bob += dist;
    const stride = onStairs ? TREAD * 1.05 : 0.68;
    if (P.stepAcc > stride) {
      P.stepAcc = 0; selfStep(onStairs);
      if (F.active && F.extraCd <= 0 && Math.random() < 0.05) { F.extraCd = rand(25, 60); setTimeout(() => running && followerStep(0.55, true), 260); }
    }
    camera.position.set(P.x, P.y + EYE + Math.sin(P.bob / stride * Math.PI) * 0.022, P.z);
    camera.rotation.set(P.pitch, P.yaw, 0);
    let tf = 1 - 0.6 * F.c * F.c; if (F.arrived) tf *= Math.random() < 0.15 ? 0.1 : 0.45;
    torch.intensity = TORCH * tf;
    torch.target.position.set(Math.sin(T * 0.9) * 0.025, -0.06 + Math.sin(P.bob * 4.6) * 0.015, -1);
    post.uniforms.time.value = T; post.uniforms.fear.value = F.c;
    updateFollower(dt, moving);
    updateWorld(dt);
    updateListener();
    findTarget();
    if (msgT > 0 && (msgT -= dt) <= 0) elMsg.style.opacity = 0;
  } else if (!started) {
    camera.position.set(P.x, EYE, P.z); camera.rotation.set(0, P.yaw, 0);
  }
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
frame();
window.__g = { P, F, lamps, A, start, free, ground, doors, lift };
</script>

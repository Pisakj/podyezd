<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; color: #cfc9b8; }

  #msg { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; font-size: 19px; padding: 0 24px; text-shadow: 0 0 8px #000; pointer-events: none; opacity: 0; transition: opacity .6s; }

  #paper li.x { text-decoration: line-through; text-decoration-color: #7a1612; text-decoration-thickness: 2px; color: #6b665a; }
  #paper .hand { font-family: 'Marker Felt', 'Comic Sans MS', cursive; color: #1c2c6b; font-size: 17px; margin-top: 10px; transform: rotate(-2deg); }

<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const H = 3;            // floor height
const FLOORS = 5;       // 0 = lobby, 1..3 = puzzle floors, 4 = home
const RUN = 2.52;       // horizontal length of a flight
const STEPS = 9, RISE = 1.5 / STEPS, TREAD = RUN / STEPS;
const SW = 3.0;         // stair shaft width (x: 0..SW)
const BX1 = 1.2, AX0 = 1.8;          // flight B is x 0..BX1, open well, flight A is x AX0..SW
const BXC = BX1 / 2, AXC = (AX0 + SW) / 2, MIDX = (BX1 + AX0) / 2;
const LAND_END = RUN + 1.3;
const HALL_W = 3.2, HALL_D = 2.6;   // hall: x -HALL_W..SW, z -HALL_D..0
const R = 0.28;         // player radius
const EYE = 1.62;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const FOG = 0x040607;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.FogExp2(FOG, 0.2);
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 40);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.AmbientLight(0x8fa3b0, 0.035));

// low-res render target + film pass: grain, dither, colour fringing, vignette
const RT_H = 432;
const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, magFilter: THREE.NearestFilter, minFilter: THREE.NearestFilter });
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, res: { value: new THREE.Vector2() }, time: { value: 0 }, fear: { value: 0 }, fade: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D t; uniform vec2 res; uniform float time, fear, fade; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + time * 37.0) * 43758.5453); }
    void main(){
      vec2 c = vUv - .5; float r2 = dot(c, c);
      vec2 uv = .5 + c * (1.0 - 0.05 * r2);
      float ca = (0.004 + 0.012 * fear) * r2;
      vec3 col = vec3(texture2D(t, uv + c * ca).r, texture2D(t, uv).g, texture2D(t, uv - c * ca).b);
      col = max(col, 0.0); col = col * 1.25 / (1.0 + col);   // keep the torch from blowing out up close
      col = pow(max(col, 0.0), vec3(1.0 / 2.2));
      float l = dot(col, vec3(.3, .59, .11));
      col = mix(vec3(l), col, 0.85 - 0.35 * fear);
      vec2 px = floor(vUv * res);
      col += (hash(px) - .5) * (0.075 + 0.07 * fear);
      float d = (mod(px.x + px.y * 2.0, 4.0) / 4.0 - .375) / 28.0;
      col = floor((col + d) * 28.0 + .5) / 28.0;
      col *= clamp(1.0 - r2 * (1.5 + fear), 0.0, 1.0);
      gl_FragColor = vec4(col * fade, 1.0);
    }`
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const w = Math.round(RT_H * innerWidth / innerHeight);
  rt.setSize(w, RT_H); post.uniforms.res.value.set(w, RT_H);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// the player's phone torch: the only light that casts shadows
const TORCH = 6;
const torch = new THREE.SpotLight(0xdde6ff, TORCH, 0, 0.5, 0.75, 1.7);
torch.position.set(0.24, -0.2, 0.1); camera.add(torch); camera.add(torch.target); torch.target.position.set(0, -0.06, -1);
torch.castShadow = true; torch.shadow.mapSize.set(1024, 1024); torch.shadow.camera.near = 0.1; torch.shadow.camera.far = 14;
torch.shadow.bias = -0.003; torch.shadow.normalBias = 0.02;

// ---------- textures ----------
function tex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function grime(g, w, h, n = 70, a = 0.09) {
  for (let i = 0; i < n; i++) {
    const r = rand(w * 0.03, w * 0.22), x = rand(0, w), y = rand(0, h);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(0,0,0,${Math.random() * a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < n * 30; i++) {
    g.fillStyle = `rgba(${Math.random() < 0.5 ? 0 : 255},${Math.random() < 0.5 ? 0 : 255},0,${Math.random() * 0.04})`;
    g.fillRect(rand(0, w), rand(0, h), 2, 2);
  }
}
const GREEN = '#3c6654', WHITE = '#b5b1a0';
// wall where paint covers [s, s+1.5] (mod 3) at each column; sFn(u 0..1) -> s in metres
function wallTex(sFn) {
  return tex(512, 512, (g, w, h) => {
    g.fillStyle = WHITE; g.fillRect(0, 0, w, h);
    for (let px = 0; px < w; px++) {
      const s = ((sFn(px / w) % 3) + 3) % 3;
      const seg = (a, b) => { // metres -> canvas
        g.fillStyle = GREEN; g.fillRect(px, h * (1 - b / 3), 1, h * (b - a) / 3);
        g.fillStyle = '#27443a'; g.fillRect(px, h * (1 - b / 3), 1, 3);
      };
      if (s + 1.5 <= 3) seg(s, s + 1.5); else { seg(s, 3); seg(0, s - 1.5); }
    }
    grime(g, w, h);
    g.strokeStyle = 'rgba(20,20,20,.25)'; g.lineWidth = 1;
    for (let i = 0; i < 14; i++) { g.beginPath(); const x = rand(0, w), y = rand(0, h); g.moveTo(x, y); g.lineTo(x + rand(-40, 40), y + rand(-40, 40)); g.stroke(); }
  });
}
const mat = (o) => new THREE.MeshLambertMaterial(o);
const mWallBand = mat({ map: wallTex(() => 0) });
const mWallBack = mat({ map: wallTex(() => 1.5) });
const mWallA = mat({ map: wallTex(u => { const z = u * LAND_END; return z < RUN ? 1.5 * z / RUN : 1.5; }), side: THREE.DoubleSide });
const mWallB = mat({ map: wallTex(u => { const z = u * LAND_END; return z < RUN ? 3 - 1.5 * z / RUN : 1.5; }), side: THREE.DoubleSide });
const tileDraw = (g, w, h) => {
  const n = 8, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    g.fillStyle = (i + j) % 2 ? '#6b5a4a' : '#8a7c68'; g.fillRect(i * s, j * s, s, s);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.strokeRect(i * s + .5, j * s + .5, s - 1, s - 1);
  }
  grime(g, w, h, 40, 0.14);
};
const mFloorHall = mat({ map: tex(256, 256, tileDraw, [5, 2.2]) });
const mFloorLand = mat({ map: tex(256, 256, tileDraw, [2.2, 1.1]) });
const mConcrete = mat({ map: tex(256, 256, (g, w, h) => { g.fillStyle = '#7c7a72'; g.fillRect(0, 0, w, h); grime(g, w, h, 90, 0.12); }) });
const mCeil = mat({ map: tex(256, 256, (g, w, h) => { g.fillStyle = '#a29e8f'; g.fillRect(0, 0, w, h); grime(g, w, h, 50, 0.1); }) });
const mRail = mat({ color: 0x2a1c14 });
const mMetal = mat({ color: 0x3a3f3d });
const mDark = mat({ color: 0x15171a });
function doorTex(base) {
  return tex(128, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.5;
    for (let i = -8; i < 12; i++) {
      g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32 + h / 2, h); g.stroke();
      g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32 - h / 2, h); g.stroke();
    }
    g.fillStyle = 'rgba(190,170,110,.6)';
    for (let y = 0; y <= h; y += 32) for (let x = (y / 32) % 2 ? 16 : 0; x <= w; x += 32) { g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    grime(g, w, h, 20, 0.15);
  });
}
const doorMats = ['#3b2318', '#2a2420', '#412b22', '#1f2a26', '#33211c'].map(c => mat({ map: doorTex(c) }));
function labelTex(text, o = {}) {
  const w = o.w || 256, h = o.h || 128;
  return tex(w, h, (g) => {
    if (o.bg) { g.fillStyle = o.bg; g.fillRect(0, 0, w, h); }
    g.fillStyle = o.color || '#111'; g.font = o.font || 'bold 90px Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = text.split('\n');
    lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * (o.lh || 40)));
    if (o.bg) grime(g, w, h, 8, 0.08);
  });
}

// ---------- geometry helpers ----------
const world = new THREE.Group(); scene.add(world);
function box(w, h, d, x, y, z, m, parent = world) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); parent.add(b); return b;
}
function plane(w, h, x, y, z, ry, m, parent = world) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.rotation.y = ry; parent.add(p); return p;
}
const TH = Math.atan2(1.5, RUN), FLEN = Math.hypot(1.5, RUN);

const lamps = [];
function addLamp(x, y, z, base, kind) {
  const light = new THREE.PointLight(0xffc98a, base, 8.5, 2); light.position.set(x, y, z); world.add(light);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe2b0, fog: false }));
  bulb.position.set(x, y, z); world.add(bulb);
  box(0.012, 0.25, 0.012, x, y + 0.17, z, mDark);
  const l = { light, bulb, base, kind, on: true, t: rand(0.5, 3), off: 0, f: 1 };
  lamps.push(l); return l;
}

const interact = [];   // {pos, label, act}
const peepholes = [];

const doors = [];
function buildDoor(x, y, z, ry, m, number, floor) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; world.add(g);
  box(1.02, 2.14, 0.05, 0, 1.07, 0.0, mDark, g);
  plane(0.9, 2.05, 0, 1.025, 0.03, 0, mVoid, g);                 // what is behind the door
  const leaf = new THREE.Group(); leaf.position.set(-0.45, 0, 0.02); g.add(leaf);
  box(0.9, 2.05, 0.07, 0.45, 1.025, 0, m, leaf);
  box(0.03, 0.12, 0.05, 0.81, 1.0, 0.04, mMetal, leaf);
  if (number == null) return g;
  const lit = Math.random() < 0.6;   // light is on inside
  const peep = new THREE.Mesh(new THREE.CircleGeometry(0.02, 10), new THREE.MeshBasicMaterial({ color: lit ? 0xffb060 : 0x101214, fog: false }));
  peep.position.set(0.45, 1.5, 0.037); leaf.add(peep);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.09), mat({ map: labelTex(String(number), { bg: '#b9a878', font: 'bold 84px Arial' }) }));
  p.position.set(0.45, 1.75, 0.037); leaf.add(p);
  box(0.8, 0.02, 0.45, 0, 0.01, 0.3, mMat, g);
  const d = { pos: new THREE.Vector3(x, y + 1.5, z), peep, lit, leaf, ajar: 0, peeped: false, knocked: false, floor, silenced: false, own: floor === FLOORS - 1 && x === 1.0, ry };
  doors.push(d);
  interact.push({ pos: d.pos, label: 'заглянуть в щель', on: () => leaf.rotation.y > 0.25 && !pk.on, act: () => startPeek(d) });
  return g;
}
const mVoid = new THREE.MeshBasicMaterial({ color: 0x000000, fog: false });
const mMat = mat({ color: 0x2e241c });
const GRAFFITI = ['ЦОЙ ЖИВ', 'НЕ СТОЙ', 'тише', 'здесь был Саня', 'ОН ИДЁТ,\nКОГДА ТЫ СТОИШЬ', 'Оля, выходи', '15 кв. — кто там?', 'не оборачивайся'].sort(() => Math.random() - 0.5);
function graffiti(x, y, z, ry) {
  const t = GRAFFITI.pop(); if (!t) return;
  const p = plane(1.1, 0.5, x, y, z, ry, mat({ map: labelTex(t, { w: 512, h: 232, font: `italic ${t.length > 14 ? 44 : 60}px "Comic Sans MS", "Marker Felt", cursive`, color: 'rgba(15,18,22,.8)', lh: 60 }), transparent: true }));
  p.rotation.z = rand(-0.12, 0.12);
}

// ---------- puzzles ----------
// which puzzle sits on floors 1..3. Random per run; ?order=switch,back,loop fixes it for testing
const qOrder = new URLSearchParams(location.search).get('order');
const ORDER = qOrder ? qOrder.split(',') : (() => { const a = ['switch', 'back', 'loop']; for (let i = 2; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const puzzleOf = n => ORDER[n - 1];
const gates = {};
const mGate = mat({ color: 0x2b2420 });
function buildGate(n, hint) {   // barred door across the flight up
  const y0 = n * H, g = new THREE.Group(); g.position.set(SW - 0.02, y0, 0); world.add(g);
  for (let k = 0; k < 10; k++) box(0.025, 2.05, 0.025, -0.04 - k * 0.125, 1.035, 0, mGate, g);
  for (const y of [0.04, 1.0, 2.05]) box(1.17, 0.04, 0.03, -0.6, y, 0, mGate, g);
  box(0.1, 0.16, 0.06, -1.1, 1.05, 0, mMetal, g);
  box(SW - AX0, 0.05, 0.04, AXC, y0 + 2.12, 0, mGate);
  for (let k = 0; k < 10; k++) box(0.025, 0.68, 0.025, SW - 0.06 - k * 0.125, y0 + 2.46, 0, mGate);
  box(0.05, 2.8, 0.05, AX0, y0 + 1.4, 0, mGate);
  const gate = gates[n] = { g, y0, closed: true, target: 0, tries: 0, pos: new THREE.Vector3(AXC, y0 + 1.1, 0) };
  interact.push({ pos: gate.pos, label: 'открыть', on: () => gate.closed, act: () => { if (gate.unlocked) { gate.target = -1.35; gateCreak(gate.pos); } else { gateRattle(gate.pos); say(++gate.tries > 2 ? hint : 'Решётка заперта.'); } } });
  return gate;
}
// puzzle 1: the switch turns off the sound, not the light. In the silence the wall tells you the gate is open
const S = { floor: 0, silent: false, solved: false };
function buildSwitchPuzzle(n) {
  const y0 = n * H; S.floor = n; S.gate = buildGate(n, 'Замка на ней нет. Её держит что-то другое.');
  box(0.09, 0.09, 0.03, -0.3, y0 + 1.45, -0.015, mat({ color: 0xbdb8a8 }));
  S.rocker = box(0.04, 0.055, 0.02, -0.3, y0 + 1.45, -0.035, mat({ color: 0xd8d3c2 })); S.rocker.rotation.x = 0.35;
  S.writing = plane(1.5, 0.6, -1.25, y0 + 1.33, -0.007, Math.PI, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0,
    map: labelTex('ПОКА ТИХО —\nОТКРЫТО', { w: 512, h: 205, font: 'bold 62px "Marker Felt", "Comic Sans MS", cursive', color: 'rgba(205,195,170,.95)', lh: 78 }) }));
  interact.push({ pos: new THREE.Vector3(-0.3, y0 + 1.45, 0), label: 'выключатель', act: pressSwitch });
}
function setSilent(v) {
  S.silent = v; const now = A.ctx.currentTime;
  S.rocker.rotation.x = v ? -0.35 : 0.35;
  if (v) { sfxSwitch(); A.master.gain.setTargetAtTime(0, now + 0.2, 0.015); }
  else { A.master.gain.setTargetAtTime(0.9, now, 0.4); sfxSwitch(0.05); }
  S.gate.target = v ? -1.35 : 0;
}
function pressSwitch() {
  if (S.solved) { sfxSwitch(); say('Щёлкает вхолостую.'); return; }
  setSilent(!S.silent);
}
function updatePuzzles(dt) {
  for (const k in gates) {
    const gt = gates[k], a = gt.g.rotation.y;
    if (a !== gt.target) { const na = a + clamp(gt.target - a, -dt * 0.7, dt * 0.7); gt.g.rotation.y = na; if (na === 0) clang(gt.pos); }
    gt.closed = gt.g.rotation.y > -0.9;
  }
  if (S.floor) {
    const m = S.writing.material; m.opacity = clamp(m.opacity + (S.silent ? dt / 2.5 : -dt / 1.2), 0, 1);
    // through the gate and up to the landing: the sound comes back, the gate shuts behind
    if (S.silent && P.z > RUN && P.y > S.floor * H + 1.3 && P.y < S.floor * H + 2) { S.solved = true; S.gate.unlocked = true; setSilent(false); }
  }
}

// puzzle 2: the gate opens only after you have stood with your back to it for 3 seconds
const B = { floor: 0, t: 0, solved: false };
function updateBack(dt) {
  if (!B.floor || B.solved) return;
  const gt = B.gate, dx = gt.pos.x - P.x, dz = gt.pos.z - P.z, d = Math.hypot(dx, dz);
  const facing = (dx * -Math.sin(P.yaw) + dz * -Math.cos(P.yaw)) / d;

}

  if (gt && gt.closed && x > MIDX && Math.abs(z) < R + 0.03 && Math.abs(y - gt.y0) < 0.7) return false;
  if (z <= -R) { if (x < -HALL_W + R || x > SW - R) return false; }

}
